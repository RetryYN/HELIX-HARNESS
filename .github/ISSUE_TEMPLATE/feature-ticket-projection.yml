name: 新世代Feature Ticketの投影
description: ローカルFeature TicketをGitHub上の作業・共有用Issueへ投影します
title: "[対象]: 日本語で作業目的を書く"
body:
  - type: markdown
    attributes:
      value: |
        このIssueは存在確認済みのローカルFeature Ticketを転記するprojectionです。要求、承認、完了の正本でも、新しい意味の入力面でもありません。ticketは作業種別と作業内容だけを持ちます（docs/governance/decisions/dev-repo-ticket-policy-po-decision-2026-10-09.md）。以下の欄はローカルticket本文から転記し、状態・依存・PR番号はticketへ書き戻しません。
  - type: input
    id: ticket_id
    attributes:
      label: Feature Ticket ID
      description: ローカル正本のstable IDを入力してください
      placeholder: FT-OS-EXAMPLE-001
    validations:
      required: true
  - type: input
    id: source_path
    attributes:
      label: ローカル正本path
      description: repository rootからの相対pathを入力してください
      placeholder: docs/governance/feature-tickets/FT-OS-EXAMPLE-001.md
    validations:
      required: true
  - type: input
    id: source_revision
    attributes:
      label: Source revision
      description: 投影元commitのfull SHAを入力してください
    validations:
      required: true
  - type: input
    id: source_digest
    attributes:
      label: ローカル正本digest
      description: Source revisionにあるFeature Ticket本文のSHA-256を入力してください
      placeholder: sha256:...
    validations:
      required: true
  - type: dropdown
    id: product_target
    attributes:
      label: 対象product
      options:
        - HELIX-HARNESS
        - HELIX-OS
        - HELIX-Web
        - HELIX-Web-OS
    validations:
      required: true
  - type: input
    id: work_kind
    attributes:
      label: 作業種別
      description: ローカルticketの作業種別をそのまま転記してください
    validations:
      required: true
  - type: textarea
    id: work_content
    attributes:
      label: 作業内容
      description: ローカルticketの作業内容を意味変更せず転記してください
    validations:
      required: true
  - type: textarea
    id: design_refs
    attributes:
      label: 正本の設計書
      description: ローカルticketが参照する設計書・判断記録のpathがあれば転記してください。正本は設計書であり、このIssueではありません
    validations:
      required: false

  - type: checkboxes
    id: authority_ack
    attributes:
      label: authority確認
      options:
        - label: Issueから要求意味・承認・完了を生成しない
          required: true
        - label: local ticketの存在、source revision、digestを確認し、欄を同ticketから転記した
          required: true
        - label: 実装へ進めるかはticketやIssueの状態ではなく、対象の上流のauthority状態で判断する
          required: true
