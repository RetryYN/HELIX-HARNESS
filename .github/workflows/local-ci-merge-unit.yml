name: local CI merge-unit照合
on:
  workflow_dispatch:
    inputs:
      target_base:
        description: exact base commit
        required: true
        type: string
      target_head:
        description: exact content HEAD commit
        required: true
        type: string
      receipt_json:
        description: compact local receipt JSON
        required: true
        type: string
permissions:
  contents: read
jobs:
  selected-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: default branchの信頼済みverifierを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: exact targetをdataとして取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.target_head }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: receipt束縛と選択済みDIFFだけを照合
        env:
          LC_TARGET_BASE: ${{ inputs.target_base }}
          LC_TARGET_HEAD: ${{ inputs.target_head }}
          LC_RECEIPT_JSON: ${{ inputs.receipt_json }}
          LC_EVENT: ${{ github.event_name }}
          LC_PERMISSION: read
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B trusted/scaffold/local-ci/provider.py
