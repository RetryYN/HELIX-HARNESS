# harness-check — HELIX-HARNESS CI (要件定義書 §6.2/§6.9)
#
# §6.9: ローカル hook は早期検知のみ。全量テスト・回帰確認は GitHub Actions で実行する。
# §6.2: Branch Protection の Required Status Checks は本 `harness-check` 1 本のみ (集約 gate)。
#
# 本 workflow は §6.5 Phase 0-A 相当 (配備するが Required 化はしない / solo)。
# トリガは §6.9 の `pull_request: [main]` に加え、solo main 直開発を即 dogfood するため `push: [main]` も含める。
#
# Lite／Windows／Full laneは独立jobとして実行し、最終aggregateへ集約する。Required Status Checks は `harness-check` 1 本だけにする。
name: harness-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: harness-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lite-consumer-canary-artifact:
    outputs:
      lane_disposition: ${{ steps.lite-lane-status.outputs.disposition }}
      skip_code: ${{ steps.lite-lane-status.outputs.skip_code }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15"

      - name: install deps (frozen)
        run: npm ci

      - name: fast Lite profile manifest closure selector
        id: lite-selector
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          candidate_head="${CANDIDATE_HEAD}"
          if ! selection_json="$(EVENT_NAME="$EVENT_NAME" REF_NAME="$REF_NAME" CANDIDATE_HEAD="$candidate_head" BEFORE_SHA="${BEFORE_SHA:-}" PR_BASE_SHA="${PR_BASE_SHA:-}" npx --no-install tsx src/cli/lite-canary-selector.ts lite-canary-selector)"; then
            selection_json='{"disposition":"required","skip_code":null,"reason_codes":["selector_uncertain"]}'
          fi
          jq . <<< "$selection_json" >> "$GITHUB_STEP_SUMMARY"
          echo "disposition=$(jq -r '.disposition' <<< "$selection_json")" >> "$GITHUB_OUTPUT"
          echo "skip_code=$(jq -r '.skip_code // "none"' <<< "$selection_json")" >> "$GITHUB_OUTPUT"

      - name: build Lite canary artifact
        id: lite-build
        if: ${{ steps.lite-selector.outputs.disposition == 'required' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/lite-canary"
          npx --no-install tsx src/cli.ts distribution package-profile \
            --profile consumer_core_v1 \
            --out "${RUNNER_TEMP}/lite-canary" \
            --json > "${RUNNER_TEMP}/lite-canary/receipt.json"

      - name: Linux Lite consumer canary
        id: linux-lite-canary
        if: ${{ steps.lite-selector.outputs.disposition == 'required' }}
        env:
          HELIX_LITE_CANARY_RECEIPT: ${{ runner.temp }}/lite-canary/receipt.json
        run: npm run test:fast -- tests/distribution-lite-consumer-canary.test.ts

      - name: upload exact Lite canary artifact
        id: lite-upload
        if: ${{ steps.lite-selector.outputs.disposition == 'required' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lite-consumer-canary
          path: ${{ runner.temp }}/lite-canary
          retention-days: 1

      - name: authorized typed Lite canary skip
        if: ${{ steps.lite-selector.outputs.disposition == 'authorized_skip' }}
        env:
          LITE_SKIP_CODE: ${{ steps.lite-selector.outputs.skip_code }}
        run: |
          set -euo pipefail
          test "$LITE_SKIP_CODE" = "closure_unaffected"
          echo "Lite canary authorized typed skip: ${LITE_SKIP_CODE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Lite typed lane status
        id: lite-lane-status
        if: ${{ always() }}
        env:
          LITE_DISPOSITION: ${{ steps.lite-selector.outputs.disposition }}
          LITE_SKIP_CODE: ${{ steps.lite-selector.outputs.skip_code }}
          LITE_BUILD_OUTCOME: ${{ steps.lite-build.outcome }}
          LINUX_CANARY_OUTCOME: ${{ steps.linux-lite-canary.outcome }}
          LITE_UPLOAD_OUTCOME: ${{ steps.lite-upload.outcome }}
        run: |
          if [ "$LITE_DISPOSITION" = "authorized_skip" ] && [ "$LITE_SKIP_CODE" = "closure_unaffected" ]; then
            echo "disposition=authorized_skip" >> "$GITHUB_OUTPUT"
            echo "skip_code=closure_unaffected" >> "$GITHUB_OUTPUT"
          elif [ "$LITE_DISPOSITION" = "required" ] && [ "$LITE_BUILD_OUTCOME" = "success" ] && [ "$LINUX_CANARY_OUTCOME" = "success" ] && [ "$LITE_UPLOAD_OUTCOME" = "success" ]; then
            echo "disposition=success" >> "$GITHUB_OUTPUT"
            echo "skip_code=none" >> "$GITHUB_OUTPUT"
          else
            echo "Lite lane did not produce success or an authorized typed skip" >&2
            exit 1
          fi

  windows-durability-smoke:
    needs: lite-consumer-canary-artifact
    if: ${{ always() && needs.lite-consumer-canary-artifact.result == 'success' }}
    outputs:
      lane_disposition: ${{ steps.windows-lane-status.outputs.disposition }}
      skip_code: ${{ steps.windows-lane-status.outputs.skip_code }}
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: checkout
        if: ${{ needs.lite-consumer-canary-artifact.outputs.lane_disposition == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: setup Node.js
        if: ${{ needs.lite-consumer-canary-artifact.outputs.lane_disposition == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15"

      - name: install deps (frozen)
        if: ${{ needs.lite-consumer-canary-artifact.outputs.lane_disposition == 'success' }}
        run: npm ci

      - name: download Linux-validated Lite artifact
        if: ${{ needs.lite-consumer-canary-artifact.outputs.lane_disposition == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: lite-consumer-canary
          path: ${{ runner.temp }}/lite-canary

      - name: Windows durability smoke
        id: windows-smoke
        if: ${{ needs.lite-consumer-canary-artifact.outputs.lane_disposition == 'success' }}
        env:
          HELIX_LITE_CANARY_RECEIPT: ${{ runner.temp }}/lite-canary/receipt.json
        run: npm run test:fast -- tests/loop-store-durability.test.ts tests/loop-store-durability-node.test.ts tests/distribution-lite-consumer-canary.test.ts

      - name: Windows typed lane status
        id: windows-lane-status
        if: ${{ always() }}
        env:
          LITE_DISPOSITION: ${{ needs.lite-consumer-canary-artifact.outputs.lane_disposition }}
          WINDOWS_SMOKE_OUTCOME: ${{ steps.windows-smoke.outcome }}
        shell: bash
        run: |
          if [ "$LITE_DISPOSITION" = "authorized_skip" ]; then
            echo "disposition=authorized_skip" >> "$GITHUB_OUTPUT"
            echo "skip_code=closure_unaffected" >> "$GITHUB_OUTPUT"
            echo "Windows lane authorized typed skip: closure_unaffected" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$LITE_DISPOSITION" = "success" ] && [ "$WINDOWS_SMOKE_OUTCOME" = "success" ]; then
            echo "disposition=success" >> "$GITHUB_OUTPUT"
            echo "skip_code=none" >> "$GITHUB_OUTPUT"
          else
            echo "Windows lane did not produce success or an authorized typed skip" >&2
            exit 1
          fi

  full-regression-preflight:
    outputs:
      full: ${{ steps.impact-ci.outputs.full }}
      reuse: ${{ steps.impact-ci.outputs.reuse }}
      candidate_head: ${{ steps.impact-ci.outputs.candidate_head }}
      base_sha: ${{ steps.impact-ci.outputs.base_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15"

      - name: install deps (frozen)
        run: npm ci

      - name: install required Linux isolation backend
        run: |
          set -euo pipefail
          apt_options=(
            -o Dir::Etc::sourcelist=/tmp/helix-ubuntu.list
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          if dpkg-query -W -f='${Status}' bubblewrap 2>/dev/null | grep -q '^install ok installed$'; then
            echo "bubblewrap is already installed on the runner"
          else
            cat > /tmp/helix-ubuntu.list <<'EOF'
          deb [arch=amd64] https://archive.ubuntu.com/ubuntu noble main universe
          deb [arch=amd64] https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [arch=amd64] https://archive.ubuntu.com/ubuntu noble-backports main universe
          deb [arch=amd64] https://security.ubuntu.com/ubuntu noble-security main universe
          EOF
            sudo timeout 180s env DEBIAN_FRONTEND=noninteractive apt-get update "${apt_options[@]}"
            sudo timeout 180s env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bubblewrap "${apt_options[@]}"
          fi
          test -x /usr/bin/bwrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: required real bubblewrap process isolation
        env:
          HELIX_BWRAP_BIN: /usr/bin/bwrap
          HELIX_REQUIRE_REAL_BWRAP: "1"
        run: npx --no-install vitest run --project fast tests/worker-isolation-broker.test.ts -t "U-WIB-007"

      - name: branch type matrix
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          branch="${HEAD_BRANCH}"
          kind="${branch%%/*}"
          case "$kind" in
            feature|design|research|poc|reverse|add|hotfix|refactor|docs|chore)
              ;;
            *)
              kind="none"
              ;;
          esac
          echo "branch=${branch}" >> "$GITHUB_STEP_SUMMARY"
          echo "kind=${kind}" >> "$GITHUB_STEP_SUMMARY"
          for subjob in plan-lint vmodel-lint branch-kind-check scrum-reverse-lint poc-no-merge-guard hotfix-postmortem-required issue-closure-contract commitlint regression-test; do
            status="skipped"
            case "$subjob:$kind" in
              plan-lint:feature|plan-lint:design|plan-lint:research|plan-lint:poc|plan-lint:reverse|plan-lint:add|plan-lint:hotfix|plan-lint:refactor) status="applicable" ;;
              vmodel-lint:feature|vmodel-lint:design|vmodel-lint:add|vmodel-lint:refactor) status="applicable" ;;
              branch-kind-check:feature|branch-kind-check:design|branch-kind-check:research|branch-kind-check:poc|branch-kind-check:reverse|branch-kind-check:add|branch-kind-check:hotfix|branch-kind-check:refactor) status="applicable" ;;
              scrum-reverse-lint:poc|scrum-reverse-lint:reverse) status="applicable" ;;
              poc-no-merge-guard:poc) status="applicable" ;;
              hotfix-postmortem-required:hotfix) status="applicable" ;;
              issue-closure-contract:feature|issue-closure-contract:design|issue-closure-contract:research|issue-closure-contract:poc|issue-closure-contract:reverse|issue-closure-contract:add|issue-closure-contract:hotfix|issue-closure-contract:refactor|issue-closure-contract:docs|issue-closure-contract:chore) status="applicable" ;;
              commitlint:feature|commitlint:design|commitlint:research|commitlint:poc|commitlint:reverse|commitlint:add|commitlint:hotfix|commitlint:refactor|commitlint:docs|commitlint:chore) status="applicable" ;;
              regression-test:feature|regression-test:add|regression-test:hotfix|regression-test:refactor) status="applicable" ;;
            esac
            echo "- ${subjob}: ${status}" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: branch-kind-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            range="${merge_base}..${PR_HEAD_SHA}"
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            range="${HEAD_SHA}^..${HEAD_SHA}"
          else
            range="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          args=(guard branch-kind --branch "$HEAD_BRANCH" --strict-unknown-prefix)
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            args+=(--changed "$path")
          done < <(git diff --name-only "$range")
          npx --no-install tsx src/cli.ts "${args[@]}"

      - name: commitlint
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            range="${merge_base}..${PR_HEAD_SHA}"
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            range="${HEAD_SHA}^..${HEAD_SHA}"
          else
            range="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          npx --no-install tsx src/cli.ts guard commitlint --range "$range"

      - name: current PR context snapshot
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '{repository: .base.repo.full_name, number: .number, title: .title, body: (.body // ""), head_ref: .head.ref, base_ref: .base.ref, head_sha: .head.sha, base_sha: .base.sha}' \
            > "$RUNNER_TEMP/pr-context-before.json"

      - name: current HEAD independent review admission
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            > "$RUNNER_TEMP/pr-review-comments-pages.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$PR_HEAD_SHA&per_page=100" \
            > "$RUNNER_TEMP/pr-review-runs-pages.json"
          gh pr diff "$PR_NUMBER" > "$RUNNER_TEMP/pr-review.diff"
          if [ "$PR_DRAFT" = "true" ]; then
            printf '{}\n' > "$RUNNER_TEMP/pr-review-current-db.json"
          else
            npx --no-install tsx src/doctor/l3-g3-logical-db-receipt.ts \
              > "$RUNNER_TEMP/pr-review-current-db.json"
          fi
          node - "$RUNNER_TEMP/pr-context-before.json" \
            "$RUNNER_TEMP/pr-review-comments-pages.json" \
            "$RUNNER_TEMP/pr-review-runs-pages.json" \
            "$RUNNER_TEMP/pr-review.diff" \
            "$RUNNER_TEMP/pr-review-current-db.json" \
            "$RUNNER_TEMP/pr-review-admission.json" <<'NODE'
          const fs = require("node:fs");
          const [contextPath, commentsPath, runsPath, diffPath, dbPath, outputPath] = process.argv.slice(2);
          const context = JSON.parse(fs.readFileSync(contextPath, "utf8"));
          const commentPages = JSON.parse(fs.readFileSync(commentsPath, "utf8"));
          const runPages = JSON.parse(fs.readFileSync(runsPath, "utf8"));
          const diff = fs.readFileSync(diffPath, "utf8");
          const currentDbReceipt = JSON.parse(fs.readFileSync(dbPath, "utf8"));
          const comments = commentPages.flat().map(({ html_url, created_at, updated_at, body }) => ({
            html_url,
            created_at,
            updated_at,
            body: body ?? "",
          }));
          const currentRunId = Number(process.env.GITHUB_RUN_ID);
          const ci_runs = runPages.flatMap((page) => page.workflow_runs ?? []).map(({
            id, run_attempt, head_sha, name, path, event, status, conclusion, updated_at, pull_requests,
          }) => ({
            id,
            attempt: run_attempt,
            head_sha,
            name,
            path,
            event,
            status,
            conclusion,
            updated_at,
            pull_request_numbers: (pull_requests ?? []).map(({ number }) => number),
          })).filter(({ id }) => !Number.isFinite(currentRunId) || id !== currentRunId);
          fs.writeFileSync(outputPath, JSON.stringify({
            repository: context.repository,
            pr_number: context.number,
            candidate_head: context.head_sha,
            state: "OPEN",
            is_draft: process.env.PR_DRAFT === "true",
            observed_at: new Date().toISOString(),
            review_packet: [
              `repository: ${context.repository}`,
              `pr_number: ${context.number}`,
              `candidate_head: ${context.head_sha}`,
              `base_branch: ${context.base_ref}`,
              `title: ${context.title}`,
              "PR body:",
              context.body,
              "Exact GitHub PR diff:",
              diff,
            ].join("\n"),
            current_db_receipt: currentDbReceipt,
            comments,
            ci_runs,
          }));
          NODE
          npx --no-install tsx src/cli.ts github pr-review-admission \
            --snapshot-file "$RUNNER_TEMP/pr-review-admission.json"

      - name: poc-no-merge-guard
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'poc/') && github.base_ref == 'main' }}
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx --no-install tsx src/cli.ts guard pr-context --snapshot-file "$RUNNER_TEMP/pr-context-before.json"

      - name: hotfix-postmortem-required
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/') && github.base_ref == 'main' }}
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx --no-install tsx src/cli.ts guard pr-context --snapshot-file "$RUNNER_TEMP/pr-context-before.json"

      - name: issue-closure-contract
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_BASE_SHA="$(node -e 'const s=require(process.argv[1]); process.stdout.write(s.base_sha)' "$RUNNER_TEMP/pr-context-before.json")"
          PR_HEAD_SHA="$(node -e 'const s=require(process.argv[1]); process.stdout.write(s.head_sha)' "$RUNNER_TEMP/pr-context-before.json")"
          git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
          merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          git diff --name-only -z "$merge_base..$PR_HEAD_SHA" > "$RUNNER_TEMP/pr-changed-paths.bin"
          node -e 'const s=require(process.argv[1]); process.stdout.write(s.body)' \
            "$RUNNER_TEMP/pr-context-before.json" > "$RUNNER_TEMP/pr-body.md"
          npx --no-install tsx src/cli.ts github workflow-identity-admission \
            --repository "$GITHUB_REPOSITORY" \
            --pr-body-file "$RUNNER_TEMP/pr-body.md" \
            --changed-file "$RUNNER_TEMP/pr-changed-paths.bin"
          npx --no-install tsx src/cli.ts github issue-closure-graph-snapshot \
            --repository "$GITHUB_REPOSITORY" \
            --pr-body-file "$RUNNER_TEMP/pr-body.md" \
            > "$RUNNER_TEMP/issue-closure-graph.json"
          npx --no-install tsx src/cli.ts guard pr-context \
            --snapshot-file "$RUNNER_TEMP/pr-context-before.json" \
            --changed-file "$RUNNER_TEMP/pr-changed-paths.bin" \
            --closure-graph-file "$RUNNER_TEMP/issue-closure-graph.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '{repository: .base.repo.full_name, number: .number, title: .title, body: (.body // ""), head_ref: .head.ref, base_ref: .base.ref, head_sha: .head.sha, base_sha: .base.sha}' \
            > "$RUNNER_TEMP/pr-context-after.json"
          cmp -s "$RUNNER_TEMP/pr-context-before.json" "$RUNNER_TEMP/pr-context-after.json" || {
            echo "pr-context-guard: current GitHub PR context drifted during admission" >&2
            exit 1
          }

      - name: issue-dependency-contract
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FOCUS_ISSUES_JSON="$(node -e 'const snapshots=require(process.argv[1]); const numbers=[...new Set(snapshots.flatMap((snapshot)=>snapshot.issues.map((issue)=>issue.number)))].sort((left,right)=>left-right); process.stdout.write(JSON.stringify(numbers))' "$RUNNER_TEMP/issue-closure-graph.json")"
          npx --no-install tsx src/cli.ts github issue-dependency-audit \
            --repository "$GITHUB_REPOSITORY" \
            --focus-issues-json "$FOCUS_ISSUES_JSON" \
            --json

      - name: issue-dependency-repository-contract
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx --no-install tsx src/cli.ts github issue-dependency-audit \
            --repository "$GITHUB_REPOSITORY" \
            --require-referenced-plans \
            --json

      - name: plan-lint
        run: npx --no-install tsx src/cli.ts plan lint --gate governance

      - name: post-merge PLAN status
        run: npx --no-install tsx src/cli.ts plan lint --gate post-merge-status

      - name: L1-L12 canonical authority drift gate
        # Authority判定をtarget runtimeのNodeで実行する。
        run: npx --no-install vitest run --project fast tests/l12-canonical-authority.test.ts tests/l12-hybrid-recognition.test.ts tests/l3-progression-authority.test.ts tests/canonical-reuse-authority.test.ts tests/runtime-authority-requirements.test.ts tests/frontmatter.test.ts tests/schema.test.ts

      - name: typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: db rebuild (deterministic projection)
        run: npx --no-install tsx src/cli.ts db rebuild --json

      - name: Impact CI profile selection
        id: impact-ci
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          body=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            current="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            pr_base_head="$(jq -r '.base.sha' <<< "$current")"
            candidate_head="$(jq -r '.head.sha' <<< "$current")"
            body="$(jq -r '.body // ""' <<< "$current")"
            draft_state="$(jq -r '.draft' <<< "$current")"
            if [ "$draft_state" = "true" ]; then
              profile="draft_preflight"
            else
              profile="candidate_admission"
            fi
            merge_base="$(git merge-base "$pr_base_head" "$candidate_head")"
            range="${merge_base}..${candidate_head}"
            base_head="$merge_base"
          else
            profile="post_merge_full"
            candidate_head="$HEAD_SHA"
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              base_head="$(git rev-parse "${HEAD_SHA}^")"
            else
              base_head="$BEFORE_SHA"
            fi
            range="${base_head}..${candidate_head}"
          fi
          body_digest="sha256:$(printf '%s' "$body" | sha256sum | cut -d' ' -f1)"
          args=(ci impact-plan --profile "$profile" --base-head "$base_head" --candidate-head "$candidate_head" --body-digest "$body_digest" --json)
          if ! git diff --name-only -z "$range" > "$RUNNER_TEMP/impact-ci-paths.bin"; then
            if [ "$EVENT_NAME" != "pull_request" ]; then
              : > "$RUNNER_TEMP/impact-ci-paths.bin"
            else
              exit 1
            fi
          fi
          while IFS= read -r -d '' path; do
            args+=(--changed "$path")
          done < "$RUNNER_TEMP/impact-ci-paths.bin"
          npx --no-install tsx src/cli.ts "${args[@]}" > "$RUNNER_TEMP/impact-ci-decision.json"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            refreshed="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            refreshed_body="$(jq -r '.body // ""' <<< "$refreshed")"
            refreshed_body_digest="sha256:$(printf '%s' "$refreshed_body" | sha256sum | cut -d' ' -f1)"
            if [ "$(jq -r '.head.sha' <<< "$refreshed")" != "$candidate_head" ] || \
               [ "$(jq -r '.base.sha' <<< "$refreshed")" != "$pr_base_head" ] || \
               [ "$(jq -r '.draft' <<< "$refreshed")" != "$draft_state" ] || \
               [ "$refreshed_body_digest" != "$body_digest" ]; then
              echo "stale_snapshot: PR HEAD/base/body changed during Impact CI selection" >&2
              exit 1
            fi
          fi
          jq . "$RUNNER_TEMP/impact-ci-decision.json" >> "$GITHUB_STEP_SUMMARY"
          full_decision="$(jq -r '.fullAdmissionRequired' "$RUNNER_TEMP/impact-ci-decision.json")"
          # Same-HEAD transition reuse: a ready_for_review / converted_to_draft event changes PR
          # state only. A prior run's full admission stays valid only when that run itself
          # completed the full regression greenly (it uploaded an impact-ci-full-receipt
          # artifact) and its receipt binds the exact same head AND base SHA, which pins the
          # identical merge tree. Any lookup failure falls back to a live full run.
          reuse="false"
          reuse_run_id=""
          if [ "$full_decision" = "true" ] && { [ "$EVENT_ACTION" = "ready_for_review" ] || [ "$EVENT_ACTION" = "converted_to_draft" ]; }; then
            prior_runs="$(gh api "repos/${REPOSITORY}/actions/workflows/harness-check.yml/runs?event=pull_request&status=success&head_sha=${candidate_head}&per_page=20" 2>/dev/null)" || prior_runs=""
            mapfile -t prior_run_ids < <(jq -r --arg current "$CURRENT_RUN_ID" '
              [.workflow_runs[]?
                | select((.id | tostring) != $current)
                | select(.conclusion == "success")]
              | sort_by(.run_started_at) | reverse | .[].id' <<< "${prior_runs:-null}" 2>/dev/null || true)
            for prior_run_id in "${prior_run_ids[@]}"; do
              artifacts="$(gh api "repos/${REPOSITORY}/actions/runs/${prior_run_id}/artifacts" 2>/dev/null)" || continue
              artifact_id="$(jq -r '[.artifacts[]? | select(.name == "impact-ci-full-receipt") | select(.expired | not)] | first | .id // empty' <<< "$artifacts" 2>/dev/null)" || continue
              [ -n "$artifact_id" ] || continue
              receipt_dir="$(mktemp -d "$RUNNER_TEMP/full-receipt.XXXXXX")"
              gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$receipt_dir/receipt.zip" 2>/dev/null || continue
              unzip -o -q "$receipt_dir/receipt.zip" -d "$receipt_dir" 2>/dev/null || continue
              receipt_tested_head="$(jq -r '.head_sha // empty' "$receipt_dir/impact-ci-full-receipt.json" 2>/dev/null)" || continue
              receipt_base_sha="$(jq -r '.base_sha // empty' "$receipt_dir/impact-ci-full-receipt.json" 2>/dev/null)" || continue
              if [ "$receipt_tested_head" = "$candidate_head" ] && [ "$receipt_base_sha" = "$pr_base_head" ]; then
                reuse="true"
                reuse_run_id="$prior_run_id"
                break
              fi
            done
          fi
          echo "reuse=${reuse}" >> "$GITHUB_OUTPUT"
          echo "reuse_run_id=${reuse_run_id}" >> "$GITHUB_OUTPUT"
          echo "candidate_head=${candidate_head}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${pr_base_head:-$base_head}" >> "$GITHUB_OUTPUT"
          echo "full=${full_decision}" >> "$GITHUB_OUTPUT"
          echo "test_files=$(jq -c '.testFiles' "$RUNNER_TEMP/impact-ci-decision.json")" >> "$GITHUB_OUTPUT"

      - name: test — 全回帰 (vitest run)
        timeout-minutes: 25
        env:
          IMPACT_CI_FULL: ${{ steps.impact-ci.outputs.full }}
          IMPACT_CI_TEST_FILES: ${{ steps.impact-ci.outputs.test_files }}
          IMPACT_CI_REUSE: ${{ steps.impact-ci.outputs.reuse }}
          IMPACT_CI_REUSE_RUN_ID: ${{ steps.impact-ci.outputs.reuse_run_id }}
          IMPACT_CI_CANDIDATE_HEAD: ${{ steps.impact-ci.outputs.candidate_head }}
          IMPACT_CI_BASE_SHA: ${{ steps.impact-ci.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [ "$IMPACT_CI_REUSE" = "true" ]; then
            if [ -z "$IMPACT_CI_REUSE_RUN_ID" ]; then
              echo "transition reuse requested without a prior green run id" >&2
              exit 1
            fi
            {
              echo "## impact-ci transition reuse receipt"
              echo "- reused_run_id: ${IMPACT_CI_REUSE_RUN_ID}"
              echo "- tested_head: $(git rev-parse HEAD)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "full admission reused from prior green run ${IMPACT_CI_REUSE_RUN_ID} (same head SHA, base tip unchanged)"
            exit 0
          fi
          if [ "$IMPACT_CI_FULL" = "true" ]; then
            # PLAN-L7-685: full profileはこのpreflightで実行せず、HEAD／base／tracked
            # inventoryへ束縛したpartition artifactを独立shard jobsへ渡す。
            mkdir -p "$RUNNER_TEMP/full-regression-shard-plan"
            git ls-files 'tests/*.test.ts' 'tests/**/*.test.ts' | LC_ALL=C sort -u \
              | jq -R -s 'split("\n") | map(select(length > 0))' \
              > "$RUNNER_TEMP/full-regression-shard-plan/inventory.json"
            npx --no-install tsx src/cli/full-regression-shards.ts plan \
              --candidate-head "$IMPACT_CI_CANDIDATE_HEAD" \
              --base-sha "$IMPACT_CI_BASE_SHA" \
              --inventory-file "$RUNNER_TEMP/full-regression-shard-plan/inventory.json" \
              > "$RUNNER_TEMP/full-regression-shard-plan/plan.json"
            exit 0
          else
            mapfile -t test_files < <(jq -r '.[]' <<< "$IMPACT_CI_TEST_FILES")
            if [ "${#test_files[@]}" -eq 0 ]; then
              echo "Impact CI produced an empty known-low selection" >&2
              exit 1
            fi
            npx --no-install vitest run --project fast --project slow "${test_files[@]}"
          fi

      - name: upload full regression shard plan
        if: ${{ steps.impact-ci.outputs.full == 'true' && steps.impact-ci.outputs.reuse != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-regression-shard-plan
          path: ${{ runner.temp }}/full-regression-shard-plan
          retention-days: 7

  full-regression-bulk-1:
    needs: [full-regression-preflight]
    if: ${{ needs.full-regression-preflight.outputs.full == 'true' && needs.full-regression-preflight.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15"
      - name: install deps (frozen)
        run: npm ci
      - name: record shard budget telemetry
        env:
          SHARD_ID: bulk-1
          SHARD_TIMEOUT_MINUTES: "25"
        run: |
          set -euo pipefail
          printf '%s\n' "- shard_id=${SHARD_ID} configured_timeout_minutes=${SHARD_TIMEOUT_MINUTES} job_result=running" >> "$GITHUB_STEP_SUMMARY"
      - name: download full regression shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: full-regression-shard-plan
          path: ${{ runner.temp }}/full-regression-shard-plan
      - name: execute bulk-1 and seal receipt
        id: shard
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/full-regression-shard-plan/plan.json"
          inventory="$RUNNER_TEMP/full-regression-shard-plan/inventory.json"
          npx --no-install tsx src/cli/full-regression-shards.ts files --plan-file "$plan" --shard-id bulk-1 > "$RUNNER_TEMP/files.json"
          mapfile -t files < <(jq -r '.[]' "$RUNNER_TEMP/files.json")
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          nice -n 10 npx --no-install vitest run --project fast "${files[@]}" > "$RUNNER_TEMP/shard.log" 2>&1
          exit_code=$?
          set -e
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          output_digest="sha256:$(sha256sum "$RUNNER_TEMP/shard.log" | cut -d' ' -f1)"
          mkdir -p "$RUNNER_TEMP/full-regression-shard-receipt-bulk-1"
          npx --no-install tsx src/cli/full-regression-shards.ts receipt --plan-file "$plan" --shard-id bulk-1 --exit-code "$exit_code" --output-digest "$output_digest" --started-at "$started_at" --completed-at "$completed_at" > "$RUNNER_TEMP/full-regression-shard-receipt-bulk-1/receipt.json"
          cat "$RUNNER_TEMP/shard.log"
          exit "$exit_code"
      - name: upload bulk-1 receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-regression-shard-receipt-bulk-1
          path: ${{ runner.temp }}/full-regression-shard-receipt-bulk-1/receipt.json
          retention-days: 7

