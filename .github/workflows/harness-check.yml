  full-regression-stateful:
    needs: [full-regression-preflight]
    if: ${{ needs.full-regression-preflight.outputs.full == 'true' && needs.full-regression-preflight.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15"
      - name: install deps (frozen)
        run: npm ci
      - name: record shard budget telemetry
        env:
          SHARD_ID: stateful
          SHARD_TIMEOUT_MINUTES: "30"
        run: |
          set -euo pipefail
          printf '%s\n' "- shard_id=${SHARD_ID} configured_timeout_minutes=${SHARD_TIMEOUT_MINUTES} job_result=running" >> "$GITHUB_STEP_SUMMARY"
      - name: download full regression shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: full-regression-shard-plan
          path: ${{ runner.temp }}/full-regression-shard-plan
      - name: install required Linux isolation backend
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: execute stateful and seal receipt
        env:
          HELIX_BWRAP_BIN: /usr/bin/bwrap
          HELIX_REQUIRE_REAL_BWRAP: "1"
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/full-regression-shard-plan/plan.json"
          npx --no-install tsx src/cli/full-regression-shards.ts files --plan-file "$plan" --shard-id stateful > "$RUNNER_TEMP/files.json"
          mapfile -t slow_files < <(jq -r '.[] | select(startswith("tests/slow/"))' "$RUNNER_TEMP/files.json")
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          (
            set -e
            npx --no-install vitest run --project fast tests/cli-surface.test.ts
            npx --no-install vitest run --project slow "${slow_files[@]}"
          ) > "$RUNNER_TEMP/shard.log" 2>&1
          exit_code=$?
          set -e
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          output_digest="sha256:$(sha256sum "$RUNNER_TEMP/shard.log" | cut -d' ' -f1)"
          mkdir -p "$RUNNER_TEMP/full-regression-shard-receipt-stateful"
          npx --no-install tsx src/cli/full-regression-shards.ts receipt --plan-file "$plan" --shard-id stateful --exit-code "$exit_code" --output-digest "$output_digest" --started-at "$started_at" --completed-at "$completed_at" > "$RUNNER_TEMP/full-regression-shard-receipt-stateful/receipt.json"
          cat "$RUNNER_TEMP/shard.log"
          exit "$exit_code"
      - name: upload stateful receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-regression-shard-receipt-stateful
          path: ${{ runner.temp }}/full-regression-shard-receipt-stateful/receipt.json
          retention-days: 7

  full-regression-finalize:
    needs:
      - full-regression-preflight
      - full-regression-bulk-1
      - full-regression-bulk-2
      - full-regression-bulk-3
      - full-regression-stateful
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      lane_disposition: ${{ steps.final-status.outputs.disposition }}
      skip_code: ${{ steps.final-status.outputs.skip_code }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15"
      - name: install deps (frozen)
        run: npm ci
      - name: classify shard outcome telemetry
        if: ${{ always() }}
        env:
          BULK_1_RESULT: ${{ needs.full-regression-bulk-1.result }}
          BULK_2_RESULT: ${{ needs.full-regression-bulk-2.result }}
          BULK_3_RESULT: ${{ needs.full-regression-bulk-3.result }}
          STATEFUL_RESULT: ${{ needs.full-regression-stateful.result }}
        run: |
          set -euo pipefail
          {
            echo "## Full regression shard outcome telemetry"
            echo "- shard=bulk-1 job_result=${BULK_1_RESULT} configured_timeout_minutes=25"
            echo "- shard=bulk-2 job_result=${BULK_2_RESULT} configured_timeout_minutes=25"
            echo "- shard=bulk-3 job_result=${BULK_3_RESULT} configured_timeout_minutes=25"
            echo "- shard=stateful job_result=${STATEFUL_RESULT} configured_timeout_minutes=30"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: download full regression shard plan
        if: ${{ needs.full-regression-preflight.outputs.full == 'true' && needs.full-regression-preflight.outputs.reuse != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: full-regression-shard-plan
          path: ${{ runner.temp }}/full-regression-shard-plan
      - name: download bulk-1 receipt
        if: ${{ needs.full-regression-preflight.outputs.full == 'true' && needs.full-regression-preflight.outputs.reuse != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: full-regression-shard-receipt-bulk-1
          path: ${{ runner.temp }}/full-regression-shard-receipt-bulk-1
      - name: download bulk-2 receipt
        if: ${{ needs.full-regression-preflight.outputs.full == 'true' && needs.full-regression-preflight.outputs.reuse != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: full-regression-shard-receipt-bulk-2
          path: ${{ runner.temp }}/full-regression-shard-receipt-bulk-2
      - name: download bulk-3 receipt
        if: ${{ needs.full-regression-preflight.outputs.full == 'true' && needs.full-regression-preflight.outputs.reuse != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: full-regression-shard-receipt-bulk-3
          path: ${{ runner.temp }}/full-regression-shard-receipt-bulk-3
      - name: download stateful receipt
        if: ${{ needs.full-regression-preflight.outputs.full == 'true' && needs.full-regression-preflight.outputs.reuse != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: full-regression-shard-receipt-stateful
          path: ${{ runner.temp }}/full-regression-shard-receipt-stateful
      - name: validate exact shard receipt set
        env:
          PREFLIGHT_RESULT: ${{ needs.full-regression-preflight.result }}
          BULK_1_RESULT: ${{ needs.full-regression-bulk-1.result }}
          BULK_2_RESULT: ${{ needs.full-regression-bulk-2.result }}
          BULK_3_RESULT: ${{ needs.full-regression-bulk-3.result }}
          STATEFUL_RESULT: ${{ needs.full-regression-stateful.result }}
          FULL_REQUIRED: ${{ needs.full-regression-preflight.outputs.full }}
          REUSE: ${{ needs.full-regression-preflight.outputs.reuse }}
        run: |
          set -euo pipefail
          [ "$PREFLIGHT_RESULT" = "success" ] || { echo "preflight failed: $PREFLIGHT_RESULT" >&2; exit 1; }
          if [ "$FULL_REQUIRED" = "true" ] && [ "$REUSE" != "true" ]; then
            [ "$BULK_1_RESULT" = "success" ] && [ "$BULK_2_RESULT" = "success" ] && [ "$BULK_3_RESULT" = "success" ] && [ "$STATEFUL_RESULT" = "success" ] || {
              echo "shard job failed/cancelled: bulk-1=$BULK_1_RESULT bulk-2=$BULK_2_RESULT bulk-3=$BULK_3_RESULT stateful=$STATEFUL_RESULT" >&2
              exit 1
            }
            npx --no-install tsx src/cli/full-regression-shards.ts validate \
              --plan-file "$RUNNER_TEMP/full-regression-shard-plan/plan.json" \
              --inventory-file "$RUNNER_TEMP/full-regression-shard-plan/inventory.json" \
              --receipt-file "$RUNNER_TEMP/full-regression-shard-receipt-bulk-1/receipt.json" \
              --receipt-file "$RUNNER_TEMP/full-regression-shard-receipt-bulk-2/receipt.json" \
              --receipt-file "$RUNNER_TEMP/full-regression-shard-receipt-bulk-3/receipt.json" \
              --receipt-file "$RUNNER_TEMP/full-regression-shard-receipt-stateful/receipt.json"
            mkdir -p "$RUNNER_TEMP/impact-ci-full-receipt"
            printf '{"head_sha":"%s","base_sha":"%s","tested_merge_head":"%s"}\n' \
              "${{ needs.full-regression-preflight.outputs.candidate_head }}" \
              "${{ needs.full-regression-preflight.outputs.base_sha }}" \
              "$(git rev-parse HEAD)" \
              > "$RUNNER_TEMP/impact-ci-full-receipt/impact-ci-full-receipt.json"
          fi
      - name: full admission receipt
        if: ${{ success() && github.event_name == 'pull_request' && needs.full-regression-preflight.outputs.full == 'true' && needs.full-regression-preflight.outputs.reuse != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: impact-ci-full-receipt
          path: ${{ runner.temp }}/impact-ci-full-receipt/impact-ci-full-receipt.json
          retention-days: 30
      - name: lint (biome)
        run: npm run lint
      - name: db rebuild (post-test projection refresh)
        run: npx --no-install tsx src/cli.ts db rebuild --json
      - name: doctor (governance hard gates)
        run: npx --no-install tsx src/cli.ts doctor
      - name: Full typed lane status
        id: final-status
        run: |
          echo "disposition=success" >> "$GITHUB_OUTPUT"
          echo "skip_code=none" >> "$GITHUB_OUTPUT"

  harness-check:
    needs: [lite-consumer-canary-artifact, windows-durability-smoke, full-regression-finalize]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require every required lane
        env:
          LITE_RESULT: ${{ needs.lite-consumer-canary-artifact.result }}
          LITE_DISPOSITION: ${{ needs.lite-consumer-canary-artifact.outputs.lane_disposition }}
          LITE_SKIP_CODE: ${{ needs.lite-consumer-canary-artifact.outputs.skip_code }}
          WINDOWS_RESULT: ${{ needs.windows-durability-smoke.result }}
          WINDOWS_DISPOSITION: ${{ needs.windows-durability-smoke.outputs.lane_disposition }}
          WINDOWS_SKIP_CODE: ${{ needs.windows-durability-smoke.outputs.skip_code }}
          FULL_RESULT: ${{ needs.full-regression-finalize.result }}
          FULL_DISPOSITION: ${{ needs.full-regression-finalize.outputs.lane_disposition }}
          FULL_SKIP_CODE: ${{ needs.full-regression-finalize.outputs.skip_code }}
        run: |
          set -euo pipefail
          check_lane() {
            lane="$1"
            result="$2"
            disposition="$3"
            skip_code="$4"
            case "${result}:${disposition}:${skip_code}" in
              success:success:none|success:authorized_skip:closure_unaffected) ;;
              *)
                echo "${lane} did not produce success or an authorized typed skip: ${result}:${disposition}:${skip_code}" >&2
                exit 1
                ;;
            esac
          }
          check_lane lite "$LITE_RESULT" "$LITE_DISPOSITION" "$LITE_SKIP_CODE"
          check_lane windows "$WINDOWS_RESULT" "$WINDOWS_DISPOSITION" "$WINDOWS_SKIP_CODE"
          check_lane full "$FULL_RESULT" "$FULL_DISPOSITION" "$FULL_SKIP_CODE"
