# Repository-local Python tooling: docs/governance/python-tooling.md
required-version = "==0.17.1"
target-version = "py312"
line-length = 88
include = ["helix/**/*.py", "scaffold/**/*.py"]
extend-exclude = [
    "archive",
    "scaffold/review-handoff/local",
    # Fixed-byte research captures: internal validators pin these exact files.
    # See docs/governance/python-tooling.md (PR #3773 F1).
    "scaffold/research/pre-isolation-outside-l1-semantic/generate.py",
    "scaffold/research/pre-isolation-outside-holding-16-30/generate.py",
    "scaffold/research/legacy-test-design-worker-workflow-0148/selfcheck.py",
    "scaffold/research/rdp001-web-webos-vision-coverage-0091/selfcheck.py",
]
force-exclude = true

[lint]
select = ["E4", "E7", "E9", "F"]
# Existing debt measured at 5751f670ed; see the selection record for counts.
# Keep formatting separate from import removal, renaming and expression changes.
ignore = ["E401", "E402", "E741", "F401", "F541", "F841"]

[format]
docstring-code-format = false
