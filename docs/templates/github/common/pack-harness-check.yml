name: pack-harness-check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pack-harness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
      - run: npm ci
      - name: HELIX setup dry-run
        run: npx --no-install helix setup project --dry-run --json
      - name: HELIX status
        run: npx --no-install helix status --json
      - name: HELIX minimal delegated workflow dry-run
        run: npx --no-install helix codex --role se --task "consumer CI smoke" --json
      - name: HELIX completion decision packet
        run: npx --no-install helix completion decision-packet --json
      - name: HELIX completion review bundle
        run: npx --no-install helix completion review-bundle --json
      - name: HELIX consumer doctor
        run: npx --no-install helix doctor --profile consumer --json
      - name: HELIX rollback rehearsal
        run: npx --no-install helix lifecycle rehearsal --operation rollback --json
      - run: npm run typecheck --if-present
      - run: npm test --if-present
