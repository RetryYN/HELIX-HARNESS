invariants:
  - Pythonは意味判断の正本、Nodeは外部副作用と単一transaction commitの正本とする。
  - module単位のbulk portを禁止し、1 behavior atom・1 versioned contract・1 PRで移管する。
  - Pythonへrepository、DB path、credential、.helix/、Git/GitHub write権限を渡さない。
  - NodeはPython出力のstrict schema、provenance、digest、lease/fence、policyを再検証してからcommitする。
  - dual-run canary成立だけで旧TS authorityを削除せず、consumer 0とRelease admissionまでrollback可能に保つ。
